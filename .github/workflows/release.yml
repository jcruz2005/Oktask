name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Maven
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install JavaFX (for jpackage)
        run: |
          sudo apt-get update
          sudo apt-get install -y openjfx

      - name: Build with Maven
        run: mvn clean package -DskipTests -q

      - name: Create app-image with jpackage
        run: |
          # Extract dependencies
          mkdir -p jpackage-input
          cp target/oktask-*.jar jpackage-input/
          
          # Copy JavaFX Linux JARs
          find ~/.m2/repository/org/openjfx -name "*linux*.jar" -exec cp {} jpackage-input/ \; 2>/dev/null || true
          
          # Create app-image
          jpackage \
            --type app-image \
            --name "OKtask" \
            --dest "target/installers" \
            --input "jpackage-input" \
            --main-class com.academic.gestor.NativeLauncher \
            --main-jar "$(ls jpackage-input/oktask-*.jar | head -1)" \
            --java-options "-Dspring.profiles.active=native" \
            --java-options "-Xmx512m" \
            --app-version "${GITHUB_REF_NAME#v}" \
            --vendor "OKtask" \
            --description "OKtask - Gestor de tareas con Pomodoro"

      - name: Package as tar.gz
        run: |
          cd target/installers
          tar -czf "../OKtask-${GITHUB_REF_NAME}-linux-x64.tar.gz" OKtask/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: target/OKtask-${{ github.ref_name }}-linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Maven
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests -q

      - name: Create MSI installer with jpackage
        run: |
          # Extract dependencies
          mkdir jpackage-input
          Copy-Item target\oktask-*.jar jpackage-input\
          
          # Copy JavaFX Windows JARs
          Get-ChildItem -Path "$env:USERPROFILE\.m2\repository\org\openjfx" -Filter "*windows*.jar" -Recurse | Copy-Item -Destination jpackage-input\ -Force
          
          # Create MSI
          jpackage `
            --type msi `
            --name "OKtask" `
            --dest "target/installers" `
            --input "jpackage-input" `
            --main-class com.academic.gestor.NativeLauncher `
            --main-jar (Get-ChildItem jpackage-input\oktask-*.jar | Select-Object -First 1).Name `
            --java-options "-Dspring.profiles.active=native" `
            --java-options "-Xmx512m" `
            --app-version "${GITHUB_REF_NAME#v}" `
            --vendor "OKtask" `
            --description "OKtask - Gestor de tareas con Pomodoro" `
            --win-menu `
            --win-shortcut
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: target/installers/OKtask-*.msi

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Maven
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests -q

      - name: Create DMG with jpackage
        run: |
          # Extract dependencies
          mkdir -p jpackage-input
          cp target/oktask-*.jar jpackage-input/
          
          # Copy JavaFX macOS JARs
          find ~/.m2/repository/org/openjfx -name "*mac*.jar" -exec cp {} jpackage-input/ \; 2>/dev/null || true
          
          # Create DMG
          jpackage \
            --type dmg \
            --name "OKtask" \
            --dest "target/installers" \
            --input "jpackage-input" \
            --main-class com.academic.gestor.NativeLauncher \
            --main-jar "$(ls jpackage-input/oktask-*.jar | head -1)" \
            --java-options "-Dspring.profiles.active=native" \
            --java-options "-Xmx512m" \
            --app-version "${GITHUB_REF_NAME#v}" \
            --vendor "OKtask" \
            --description "OKtask - Gestor de tareas con Pomodoro"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: target/installers/OKtask-*.dmg

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-x64/OKtask-*.tar.gz
            windows-x64/OKtask-*.msi
            macos-arm64/OKtask-*.dmg
          generate_release_notes: true
