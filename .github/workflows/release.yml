name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Install JavaFX
        run: |
          sudo apt-get update
          sudo apt-get install -y openjfx

      - name: Build
        run: |
          mvn clean package -DskipTests -q
          bash build-linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: target/OKtask-*-linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build
        run: |
          mvn clean package -DskipTests -q
          cmd /c build-windows.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: target/installers/OKtask-*.msi

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build
        run: |
          mvn clean package -DskipTests -q
          bash build-macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: target/installers/OKtask-*.dmg

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Downgrade SDK for CI compatibility
        run: |
          sed -i 's/compileSdkVersion = 37/compileSdkVersion = 34/' mobile/android/variables.gradle
          sed -i 's/targetSdkVersion = 37/targetSdkVersion = 34/' mobile/android/variables.gradle
          sed -i "s/androidxAppCompatVersion = '1.7.1'/androidxAppCompatVersion = '1.6.1'/" mobile/android/variables.gradle
          sed -i "s/androidxCoreVersion = '1.17.0'/androidxCoreVersion = '1.12.0'/" mobile/android/variables.gradle
          sed -i "s/androidxActivityVersion = '1.11.0'/androidxActivityVersion = '1.8.2'/" mobile/android/variables.gradle
          sed -i "s/androidxFragmentVersion = '1.8.9'/androidxFragmentVersion = '1.6.2'/" mobile/android/variables.gradle
          sed -i "s/androidxCoordinatorLayoutVersion = '1.3.0'/androidxCoordinatorLayoutVersion = '1.2.0'/" mobile/android/variables.gradle

      - name: Copy frontend to mobile/www
        run: |
          rm -rf mobile/www
          cp -r src/main/resources/static mobile/www
          # Overlay mobile-specific files
          cp -r mobile/overrides/* mobile/www/

      - name: Sync Capacitor
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk \
             "OKtask-${VERSION}-android.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: OKtask-*-android.apk

  release:
    needs: [build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-x64/OKtask-*.tar.gz
            windows-x64/OKtask-*.msi
            macos-arm64/OKtask-*.dmg
            android-apk/OKtask-*-android.apk
          generate_release_notes: true
