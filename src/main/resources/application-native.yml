# Profile activo cuando se ejecuta como app nativa
#
# @author OKtask
# @since 1.1.0

server:
  port: 8080

spring:
  application:
    name: oktask
  
  # Lazy initialization agresiva
  main:
    lazy-initialization: true
    banner-mode: off

  # Deshabilitar auto-configs innecesarias para app de escritorio
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.ssl.SslAutoConfiguration
      - org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration
      - org.springframework.boot.autoconfigure.freemarker.FreeMarkerAutoConfiguration
      - org.springframework.boot.autoconfigure.groovy.template.GroovyTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.mustache.MustacheAutoConfiguration
      - org.springframework.boot.autoconfigure.thymeleaf.ThymeleafAutoConfiguration

  # Configuración de base de datos SQLite
  datasource:
    url: jdbc:sqlite:${user.home}/.oktask/data/oktask.db
    driver-class-name: org.sqlite.JDBC
  
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

# Logging mínimo
logging:
  level:
    root: ERROR
    com.academic.gestor: INFO
    org.springframework: ERROR
    org.hibernate: ERROR

# Configuración del Pomodoro
pomodoro:
  duracion-trabajo: 25
  duracion-descanso: 5
  duracion-descanso-largo: 15
  pomodoros-para-descanso-largo: 4
