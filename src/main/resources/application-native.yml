# Profile activo cuando se ejecuta como app nativa
#
# Este perfil se activa automáticamente cuando la aplicación
# se ejecuta como una aplicación de escritorio nativa usando
# el NativeLauncher con JavaFX WebView.
#
# @author OKtask
# @since 1.1.0

server:
  port: 8080

spring:
  application:
    name: oktask
  
  # Configuración de base de datos SQLite
  # Usa directorio del usuario para persistencia entre sesiones
  datasource:
    url: jdbc:sqlite:${user.home}/.oktask/data/oktask.db
    driver-class-name: org.sqlite.JDBC
  
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false

# Configuración de logging para producción
logging:
  level:
    root: WARN
    com.academic.gestor: INFO
    org.springframework: WARN
    org.hibernate: WARN
